<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ăn Tăng Cân</title>
    <meta name="description" content="Thực đơn tăng cân tự xoay vòng mỗi ngày và nhật ký cân nặng.">
    <meta name="theme-color" content="#f5f7f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231e7048'/><path d='M9 21c0-6 4-11 13-12-1 9-6 13-12 13' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!--APP-START-->
    <header class="app-header">
      <a class="brand" href="#today">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 21c0-6 4-11 13-12-1 9-6 13-12 13" fill="none" stroke="var(--card)" stroke-width="2.4" stroke-linecap="round"/></svg>
        Ăn Tăng Cân
      </a>
    </header>

    <main id="view" class="container" aria-live="polite"></main>

    <nav class="tabs" aria-label="Chuyển trang">
      <a href="#today" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 4v5a2 2 0 0 0 2 2M3 4v16M21 4c-1.5 0-2.5 2-2.5 5s1 4 2.5 4v7"/></svg>
        Hôm nay
      </a>
      <a href="#week" data-tab="week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3M13 14h3M8 17h3"/></svg>
        Tuần
      </a>
      <a href="#weight" data-tab="weight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 9.5a5 5 0 0 1 8 0"/><path d="M12 9.5l1.5-2"/></svg>
        Cân nặng
      </a>
      <a href="#dishes" data-tab="dishes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/><path d="M9 8.5h5"/></svg>
        Món ăn
      </a>
    </nav>

    <dialog id="swap-dialog"></dialog>
    <div id="toast" role="status"></div>
    <!--APP-END-->

    <noscript><p class="container">Trang này cần bật JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
